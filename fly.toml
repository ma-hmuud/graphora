# fly.toml app configuration file generated for graphora-ytaqpg on 2026-06-01T17:14:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'graphora-ytaqpg'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
