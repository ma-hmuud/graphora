scalar JSON

enum GraphStatus {
  PROCESSING
  READY
  FAILED
}

type Graph {
  id: ID!
  name: String!
  status: GraphStatus!
  sourceColumn: String
  targetColumn: String
  isDirected: Boolean!
  isWeighted: Boolean!
  nodeCount: Int
  edgeCount: Int
  density: Float
  componentsCount: Int
  communitiesCount: Int
  shareSlug: String
  errorMessage: String
  graphData: JSON
  createdAt: String!
  updatedAt: String!
  dataset: Dataset!
}

input CreateGraphInput {
  name: String!
  datasetId: ID!
  sourceColumn: String
  targetColumn: String
  isDirected: Boolean
  isWeighted: Boolean
}

input UpdateGraphInput {
  name: String
  status: GraphStatus
  isDirected: Boolean
  isWeighted: Boolean
  shareSlug: String
}

extend type Query {
  graphs: [Graph!]!
  graph(id: ID!): Graph!
}

extend type Mutation {
  createGraph(input: CreateGraphInput!): Graph!
  regenerateGraph(id: ID!): Graph!
  updateGraph(id: ID!, input: UpdateGraphInput!): Graph!
  deleteGraph(id: ID!): Boolean!
}
